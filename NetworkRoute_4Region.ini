[custom]
; Mihomo custom profile for HK / JP / SG / US routes.
; Country groups use url-test so one best node is selected instead of spreading
; sessions across multiple relays with load-balance.

; Rules
; Keep ChatGPT file uploads on the same OpenAI proxy policy.
ruleset=🤖 OpenAI,[]DOMAIN-SUFFIX,oaiusercontent.com
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🤖 OpenAI,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list
ruleset=📢 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=📲 电报信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=📹 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🎥 奈飞视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=☁️ Cloudflare CDN,[]GEOIP,cloudflare
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; Main selectors
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🛟 故障转移`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=☑️ 手动切换`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,5,80
custom_proxy_group=🛟 故障转移`fallback`.*`https://www.gstatic.com/generate_204`300,5,80

; Region selectors.  The generated node names contain HK / JP / SG / US.
custom_proxy_group=🇭🇰 香港节点`url-test`(^|[^A-Z])(HK|HKG|Hong Kong|HongKong|香港|港)([^A-Z]|$)`https://www.gstatic.com/generate_204`300,5,80
custom_proxy_group=🇯🇵 日本节点`url-test`(^|[^A-Z])(JP|Japan|日本|东京|大阪)([^A-Z]|$)`https://www.gstatic.com/generate_204`300,5,80
custom_proxy_group=🇸🇬 新加坡节点`url-test`(^|[^A-Z])(SG|Singapore|新加坡|狮城)([^A-Z]|$)`https://www.gstatic.com/generate_204`300,5,80
custom_proxy_group=🇺🇸 美国节点`url-test`(^|[^A-Z])(US|USA|United States|美国|美)([^A-Z]|$)`https://www.gstatic.com/generate_204`300,5,120

; Service policies. Each group exposes the same complete set of choices.
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]♻️ 自动选择`[]🛟 故障转移`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=🎥 奈飞视频`select`[]🚀 节点选择`[]♻️ 自动选择`[]🛟 故障转移`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🛟 故障转移`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]♻️ 自动选择`[]🛟 故障转移`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=🤖 OpenAI`select`[]🇺🇸 美国节点`[]🚀 节点选择`[]♻️ 自动选择`[]🛟 故障转移`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]🛟 故障转移`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]☑️ 手动切换
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]🛟 故障转移`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]☑️ 手动切换
custom_proxy_group=📢 谷歌服务`select`[]🚀 节点选择`[]♻️ 自动选择`[]🛟 故障转移`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=☁️ Cloudflare CDN`select`[]🐟 漏网之鱼`[]🚀 节点选择`[]♻️ 自动选择`[]🛟 故障转移`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]☑️ 手动切换`[]DIRECT

; Terminal policies
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]🎯 全球直连`[]☑️ 手动切换

enable_rule_generator=true
overwrite_original_rules=true
